# 用 GitHub Actions + Android NDK 交叉编译 gproxy (aarch64-linux-android)
# 原理：与 gproxy 官方 Android 构建相同（NDK 工具链），但我们保留 section headers
#       且动态链接 bionic —— Termux 就是 Android bionic 环境，可直接运行。
# 使用方法：
#   1. fork https://github.com/LeenHawk/gproxy
#   2. 把本文件放到 fork 仓库的 .github/workflows/build-termux.yml
#   3. Actions 页面手动触发 "Build gproxy for Termux"
#   4. 下载 artifact，在 Termux 里 chmod +x 运行

name: Build gproxy for Termux

on:
  workflow_dispatch:        # 手动触发

permissions:
  contents: read

jobs:
  build-ndk:
    name: Cross-compile gproxy (aarch64-linux-android) with NDK
    runs-on: ubuntu-latest   # x86_64 runner + NDK 交叉编译（官方同款）
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v7

      # ── 第 1 步：构建 console 前端（rust-embed 嵌入）──
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: console/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml

      - name: Build console (embed)
        working-directory: console
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # ── 第 2 步：安装 Rust + Android 目标 ──
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # ── 第 3 步：安装 Android NDK（btls-sys 编译 BoringSSL 需要）──
      - uses: android-actions/setup-ndk@v3
        with:
          ndk-version: r27d

      # ── 第 4 步：交叉编译 ──
      - name: Cross-compile gproxy
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          # Rust 交叉编译链接器用 NDK 的 clang
          CC_aarch64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
          CXX_aarch64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++
          AR_aarch64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_BUILD_TARGET: aarch64-linux-android
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          ls $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/
          # bindgen 需要 libclang
          sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev ninja-build > /dev/null 2>&1
          cargo build --release --target aarch64-linux-android
          echo "==> 构建完成"
          cp target/aarch64-linux-android/release/gproxy ./gproxy-termux
          file gproxy-termux

      # ── 第 5 步：上传产物 ──
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gproxy-termux-aarch64
          path: gproxy-termux
          if-no-files-found: error
